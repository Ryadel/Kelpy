# Publishes a release when a version tag is pushed:
#
#   git tag -a v0.1.0 -m "Release notes"
#   git push origin v0.1.0
#
# The tag annotation becomes the release notes. The release appears only when every file is built, so
# `releases/latest/download/` never points at a release with a file missing. The file names are what
# https://kelpy.io/install.sh and install.ps1 download: renaming one breaks the install command.
#
# Windows executables are signed with Azure Artifact Signing once the repository variables AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_CLIENT_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and
# AZURE_CERTIFICATE_PROFILE exist; the Entra application trusts this workflow through a federated credential for the
# `release` environment (subject repo:Ryadel/Kelpy:environment:release).

name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from any branch: everything is built and tested, nothing is published.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.asset }}
    needs: web
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
      # Azure sign-in for Windows signing, through the federated credential.
      id-token: write
    strategy:
      # One platform failing must not hide how the others went.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: kelpy-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: kelpy-linux-aarch64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: kelpy-windows-x86_64.exe
          - os: macos-15
            target: aarch64-apple-darwin
            asset: kelpy-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: kelpy-macos-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      # The Web UI is embedded at build time; without web/dist the executable would ship without it.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: test -f web/dist/index.html

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p kelpy --target ${{ matrix.target }}
      - name: Name the executable as the release does
        run: |
          mkdir dist
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/kelpy$suffix" "dist/${{ matrix.asset }}"

      - if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\${{ matrix.asset }}
          exclude-environment-credential: true
          description: Kelpy
          description-url: https://kelpy.io
      - if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        name: Check the signature
        shell: powershell
        run: |
          $signature = Get-AuthenticodeSignature "dist\${{ matrix.asset }}"
          if ($signature.Status -ne 'Valid') { throw "Signature: $($signature.Status) $($signature.StatusMessage)" }
          $signature.SignerCertificate.Subject

      - name: Check that the executable stands alone
        run: |
          exe="dist/${{ matrix.asset }}"
          case "$RUNNER_OS" in
            Linux)
              file "$exe" | grep -q 'static' || { file "$exe"; echo "::error::not statically linked"; exit 1; }
              ;;
            Windows)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              dumpbin="$("$vswhere" -latest -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | head -n 1)"
              imports="$("$dumpbin" -nologo -dependents "$exe")"
              if echo "$imports" | grep -qi 'vcruntime\|api-ms-win-crt'; then
                echo "$imports"; echo "::error::depends on the Visual C++ runtime"; exit 1
              fi
              ;;
            macOS)
              # Only the system's own libraries, nothing from Homebrew or another prefix.
              libraries="$(otool -L "$exe" | tail -n +2)"
              if echo "$libraries" | grep -v '/usr/lib/\|/System/Library/' | grep -q .; then
                echo "$libraries"; echo "::error::depends on libraries outside the system"; exit 1
              fi
              ;;
          esac
          "$exe" --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The checkout keeps the tag without its annotation, which is the release notes.
      - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: kelpy-*
          path: dist
          merge-multiple: true
      - name: Add the install scripts and the checksums
        working-directory: dist
        run: |
          cp ../scripts/install.sh ../scripts/install.ps1 .
          sha256sum kelpy-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      # Kelpy installs an update only with this signature, checked against the key built into it
      # (scripts/release-key.pem is the same key). The private key is the RELEASE_SIGNING_KEY secret.
      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey ../scripts/release-key.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "Kelpy ${GITHUB_REF_NAME#v}" dist/*

  # The published release, installed with the command people copy, on clean runners: Kelpy must start, serve the
  # Web UI, stop, and find itself up to date.
  install:
    name: Install on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022, windows-2025]
    steps:
      - name: Install and run (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export KELPY_VERSION="$GITHUB_REF_NAME"
          curl -fsSL https://kelpy.io/install.sh | sh -s -- --shutdown-after 10m > kelpy.log 2>&1 &
          kelpy="$HOME/Kelpy/kelpy"
          for _ in $(seq 1 60); do
            if [ -x "$kelpy" ] && "$kelpy" status > status.txt 2>&1; then break; fi
            sleep 2
          done
          cat kelpy.log status.txt
          test "$("$kelpy" --version)" = "kelpy ${GITHUB_REF_NAME#v}"
          url="$(sed -n 's/^ *URL: *//p' status.txt)"
          curl -fsS "$url/" | grep -q '<title>Kelpy</title>'
          "$kelpy" stop
          wait
          "$kelpy" update | tee update.txt
          grep -q 'is the latest version' update.txt

      # Windows PowerShell 5.1, as on Windows Server 2016.
      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:KELPY_VERSION = $env:GITHUB_REF_NAME
          New-Item -ItemType File -Path empty.txt | Out-Null
          $install = Start-Process powershell -PassThru -NoNewWindow -RedirectStandardInput empty.txt `
            -RedirectStandardOutput kelpy.log -RedirectStandardError kelpy.err `
            -ArgumentList '-NoProfile', '-Command', 'irm https://kelpy.io/install.ps1 | iex'
          $kelpy = Join-Path $HOME 'Kelpy\kelpy.exe'
          $status = $null
          foreach ($attempt in 1..60) {
            if (Test-Path $kelpy) {
              $status = & $kelpy status 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0 -and $status -match 'is running') { break }
            }
            Start-Sleep -Seconds 2
          }
          Get-Content kelpy.log, kelpy.err
          $status
          $version = & $kelpy --version
          if ($version -ne "kelpy $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "Version: $version" }
          $url = ([regex]::Match($status, 'URL:\s+(\S+)')).Groups[1].Value
          $page = Invoke-WebRequest -Uri "$url/" -UseBasicParsing
          if ($page.Content -notmatch '<title>Kelpy</title>') { throw 'The Web UI did not answer' }
          & $kelpy stop
          $install.WaitForExit()
          $update = & $kelpy update | Out-String
          $update
          if ($update -notmatch 'is the latest version') { throw 'kelpy update did not find this release' }
