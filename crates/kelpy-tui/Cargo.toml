[package]
name = "kelpy-tui"
description = "Kelpy's terminal UI: a client of the runtime's local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.34"
kelpy-client = { path = "../kelpy-client" }
kelpy-common = { path = "../kelpy-common" }
kelpy-core = { path = "../kelpy-core" }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
unicode-width = "0.2.3"

[dev-dependencies]
kelpy-gateway = { path = "../kelpy-gateway" }
kelpy-test-support = { path = "../kelpy-test-support" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
