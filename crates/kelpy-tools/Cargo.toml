[package]
name = "kelpy-tools"
description = "Kelpy tools: what the model may use to look at and change the system, and the executor that runs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
getrandom = "0.4.3"
kelpy-common = { version = "0.1.0", path = "../kelpy-common" }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "2.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
