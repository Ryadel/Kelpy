[package]
name = "kelpy-remote"
description = "Kelpy's remote access: the embedded SSH server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
kelpy-common = { path = "../kelpy-common" }
kelpy-core = { path = "../kelpy-core" }
kelpy-tui = { path = "../kelpy-tui" }
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "io-util", "fs", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
