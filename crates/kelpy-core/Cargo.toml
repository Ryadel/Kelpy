[package]
name = "kelpy-core"
description = "Kelpy core: the home folder, configuration, owner-only files and shared types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs = "7.0.0"
kelpy-common = { version = "0.1.0", path = "../kelpy-common" }
kelpy-providers = { version = "0.1.0", path = "../kelpy-providers" }
kelpy-storage = { version = "0.1.0", path = "../kelpy-storage" }
kelpy-tools = { version = "0.1.0", path = "../kelpy-tools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
toml_edit = "0.25.17"


[dev-dependencies]
kelpy-test-support = { version = "0.1.0", path = "../kelpy-test-support" }
rusqlite = "0.41.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }


[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
