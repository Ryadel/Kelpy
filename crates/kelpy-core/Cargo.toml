[package]
name = "kelpy-core"
description = "Kelpy core: the home folder, configuration, owner-only files and shared types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
kelpy-common = { path = "../kelpy-common" }
kelpy-providers = { path = "../kelpy-providers" }
kelpy-storage = { path = "../kelpy-storage" }
kelpy-tools = { path = "../kelpy-tools" }
ring = { version = "0.17.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "net", "io-util", "process", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
toml_edit = "0.25.17"
zeroize = { version = "1.9.1", features = ["serde"] }


[dev-dependencies]
kelpy-test-support = { path = "../kelpy-test-support" }
rusqlite = "0.41.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "test-util"] }


[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-future = "0.3.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
