[package]
name = "kelpy-providers"
description = "Kelpy providers: one interface over the AI model APIs, with streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "form", "http2", "system-proxy"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
kelpy-test-support = { version = "0.1.0", path = "../kelpy-test-support" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
