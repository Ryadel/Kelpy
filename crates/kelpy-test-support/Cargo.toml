[package]
name = "kelpy-test-support"
description = "Kelpy test support: fake HTTP servers for the tests of several crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "sync", "time"] }
